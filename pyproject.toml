[project]
name = "ercot-price-analysis"
version = "0.1.0"
description = "Analysis and forecasting of ERCOT electricity prices"
readme = "README.md"
authors = [
    { name = "rhythmpatel12", email = "rhythm.patel12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ercot"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
